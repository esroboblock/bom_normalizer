name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest
      - shell: bash
        run: >
          bom-normalizer normalize
          --bom examples/bom.csv
          --coordinates examples/coordinates.csv
          --mapping examples/mapping.json
          --output "${RUNNER_TEMP}/normalized.json"
      - shell: bash
        run: >
          python -m bom_normalizer normalize
          --bom examples/bom-only.csv
          --mapping examples/mapping-bom-only.json
          --output "${RUNNER_TEMP}/normalized-bom-only.json"
